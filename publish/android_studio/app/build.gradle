apply plugin: 'com.android.application'

android {
    signingConfigs {
        release {
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
            storeFile file(RELEASE_STORE_FILE)
            storePassword  RELEASE_STORE_PASSWORD
        }
        debug {
            keyAlias DEBUG_KEY_ALIAS
            keyPassword DEBUG_KEY_PASSWORD
            storeFile file(DEBUG_STORE_FILE)
            storePassword DEBUG_STORE_PASSWORD
        }
    }
    compileSdkVersion 30
    buildToolsVersion '33.0.1'
    useLibrary 'org.apache.http.legacy'
    defaultConfig {
		applicationId "com.layabox.conch"
        versionCode VERSION_CODE.toInteger()
        versionName VERSION_NAME
        minSdkVersion MIN_SDK_VERSION.toInteger()
        targetSdkVersion TARGET_SDK_VERSION.toInteger()
        multiDexEnabled false
        ndk {
            // 设置支持的SO库架构
            abiFilters ABI_FILETERS.split(',')
        }
        /*externalNativeBuild {
            cmake {
                cppFlags '-fno-rtti -fexceptions -Wno-multichar'
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_PLATFORM=android-21', '-DANDROID_ARM_NEON=TRUE', '-DANDROID_TOOLCHAIN=clang'
                abiFilters ABI_FILETERS.split(',')
            }
        }*/
    }
    sourceSets.main {
        jniLibs.srcDir 'libs'
    }
    buildTypes {
        release {
            zipAlignEnabled true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            zipAlignEnabled true
            signingConfig signingConfigs.debug
        }
    }
    // java8配置
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    android {
        ndkVersion "21.0.6113669"//ndk r21e
    }
    namespace 'com.layabox.conch'
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    /*externalNativeBuild {
        cmake {
            path "../../../CMakeLists.txt"
        }
    }*/
}
dependencies {
    implementation fileTree(dir: 'libs')
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation project(path: ':conch')
    testImplementation 'junit:junit:4.12'
    implementation 'androidx.appcompat:appcompat:1.0.0'
}
