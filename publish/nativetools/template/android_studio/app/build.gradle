apply plugin: 'com.android.application'

android {
    signingConfigs {
        release {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file("../debug.keystore")
            storePassword 'android'
        }
        debug {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file("../debug.keystore")
            storePassword 'android'
        }
    }
    compileSdkVersion 30
    buildToolsVersion '30.0.3'
    useLibrary 'org.apache.http.legacy'
    defaultConfig {
		applicationId "com.layabox.conch"
        versionCode 1
        versionName "release-1"
        minSdkVersion 19
        targetSdkVersion 29
        multiDexEnabled true //方法数超过65536时，开启多dex的支持
        ndk {
            // 设置支持的SO库架构
            abiFilters 'arm64-v8a', 'armeabi-v7a','x86','x86_64'
        }
        flavorDimensions "default"
        externalNativeBuild {
            cmake {
                cppFlags '-fno-rtti -fexceptions -Wno-multichar'
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_PLATFORM=android-21', '-DANDROID_ARM_NEON=TRUE', '-DANDROID_TOOLCHAIN=clang'
                abiFilters 'arm64-v8a', 'armeabi-v7a','x86','x86_64'//, 'armeabi'
            }
        }
    }
    sourceSets.main {
        jniLibs.srcDir 'libs'
    }
    buildTypes {
        release {
            zipAlignEnabled true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            zipAlignEnabled true
            signingConfig signingConfigs.debug
        }
    }
    // java8配置
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    android {
        ndkVersion "21.0.6113669"//ndk r21e
    }
    namespace 'com.layabox.conch'
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    externalNativeBuild {
        cmake {
            path "../../../../../Conch/CMakeLists.txt"
        }
    }
}
repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs')
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation project(path: ':conch')
    testImplementation 'junit:junit:4.12'
    implementation 'androidx.appcompat:appcompat:1.0.0'
}
